<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
:root{
  --ground:#F5F6F8; --card:#FFFFFF; --ink:#141924; --ink-soft:#59617A;
  --line:#DFE3EB; --line-soft:#EDF0F5;
  --indigo:#26407E; --indigo-soft:#E8ECF7;
  --yoruba:#9C5F2B; --igbo:#2F6B4A; --hausa:#94303B; --other:#5B5468;
  --shadow:0 1px 2px rgba(20,25,36,.05),0 8px 24px -12px rgba(20,25,36,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0E1219; --card:#161C27; --ink:#E9ECF2; --ink-soft:#98A1B8;
    --line:#28303F; --line-soft:#1E2530;
    --indigo:#8FA8E8; --indigo-soft:#1B2740;
    --yoruba:#D79A5E; --igbo:#6CB98C; --hausa:#DA7B84; --other:#A79CBC;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1219; --card:#161C27; --ink:#E9ECF2; --ink-soft:#98A1B8;
  --line:#28303F; --line-soft:#1E2530;
  --indigo:#8FA8E8; --indigo-soft:#1B2740;
  --yoruba:#D79A5E; --igbo:#6CB98C; --hausa:#DA7B84; --other:#A79CBC;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:660px;margin:0 auto;padding:28px 20px 120px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px}
h1{font-family:"IBM Plex Sans";font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em}
.sub{color:var(--ink-soft);font-size:13px;margin:0}
.bar{height:3px;background:var(--line-soft);border-radius:2px;overflow:hidden;margin:16px 0 22px}
.bar>i{display:block;height:100%;background:var(--indigo);width:0;transition:width .25s ease}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow);padding:30px 28px 26px}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.chip{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;
  letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:4px;
  border:1px solid var(--line);color:var(--ink-soft)}
.chip.src{background:var(--indigo-soft);border-color:transparent;color:var(--indigo);font-weight:500}
.name{font-family:Newsreader,Georgia,serif;font-size:clamp(38px,8vw,58px);
  line-height:1.05;margin:0 0 6px;letter-spacing:-.02em;text-wrap:balance}
.why{color:var(--ink-soft);font-size:13px;margin:0 0 20px}
.rules{border-top:1px solid var(--line-soft);padding-top:16px;margin-bottom:22px}
.rules h2{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-soft);margin:0 0 9px}
.res{display:flex;gap:6px;flex-wrap:wrap}
.res code{font-family:"IBM Plex Mono",monospace;font-size:12.5px;padding:3px 7px;
  border-radius:4px;background:var(--line-soft);color:var(--ink)}
.res code.link{background:var(--indigo-soft);color:var(--indigo);font-weight:500}
.q{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-soft);margin:0 0 10px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
button{font-family:inherit;font-size:14px;cursor:pointer;border-radius:7px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:11px 14px;text-align:left;display:flex;align-items:center;gap:10px;
  transition:border-color .12s,background .12s,transform .06s}
button:hover{border-color:var(--ink-soft)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
kbd{font-family:"IBM Plex Mono",monospace;font-size:11px;min-width:18px;height:18px;
  display:inline-flex;align-items:center;justify-content:center;border-radius:3px;
  background:var(--line-soft);color:var(--ink-soft);padding:0 4px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.y .dot{background:var(--yoruba)} .i .dot{background:var(--igbo)}
.h .dot{background:var(--hausa)} .o .dot{background:var(--other)}
.y:hover{border-color:var(--yoruba)} .i:hover{border-color:var(--igbo)}
.h:hover{border-color:var(--hausa)} .o:hover{border-color:var(--other)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ghost{color:var(--ink-soft)}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);
  border-top:1px solid var(--line);padding:11px 20px}
.fin{max-width:660px;margin:0 auto;display:flex;align-items:center;
  justify-content:space-between;gap:14px;flex-wrap:wrap}
.tally{display:flex;gap:14px;font-size:12.5px;color:var(--ink-soft);
  font-variant-numeric:tabular-nums;flex-wrap:wrap}
.tally b{color:var(--ink);font-weight:600}
.acts{display:flex;gap:8px}
.acts button{padding:7px 12px;font-size:13px}
.done{text-align:center;padding:48px 20px}
.done h2{font-family:Newsreader,Georgia,serif;font-size:30px;margin:0 0 8px;font-weight:500}
textarea{width:100%;height:280px;font-family:"IBM Plex Mono",monospace;font-size:12px;
  line-height:1.6;padding:12px;border-radius:7px;border:1px solid var(--line);
  background:var(--ground);color:var(--ink);resize:vertical;white-space:pre}
textarea:focus-visible{outline:2px solid var(--indigo);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
</style>

<div class="wrap">
  <header>
    <h1>Nigerian name lexicon &mdash; review, batch 2</h1>
    <p class="sub" id="pos"></p>
  </header>
  <div class="bar"><i id="prog"></i></div>
  <div id="main"></div>
</div>
<footer>
  <div class="fin">
    <div class="tally" id="tally"></div>
    <div class="acts">
      <button id="undo">Undo <kbd>U</kbd></button>
      <button id="exp">Export TSV</button>
    </div>
  </div>
</footer>

  tally();

  if (i < 0){
    main.innerHTML = '<div class="card done"><h2>All reviewed</h2>' +
      '<p class="sub">Export the TSV and drop it into <code>lexicon.tsv</code>.</p></div>';
    return;
  }
  const r = ROWS[i];
  const links = r.links_to ? r.links_to.split("|") : [];
  const res = r.residues ? r.residues.split("|").filter(Boolean) : [];
  main.innerHTML =
    '<div class="card">' +
      '<div class="meta">' +
        (r.wiki_tradition && r.wiki_tradition !== "unknown"
          ? '<span class="chip src">suggested: ' + r.wiki_tradition.replace(/\|/g,", ") + '</span>' : '') +
        '<span class="chip">' + r.wiki_type.replace(/\|/g,", ") + '</span>' +
      '</div>' +
      '<p class="name">' + r.name + '</p>' +
      '<p class="why">' + r.why + '</p>' +
      (res.length ? '<div class="rules"><h2>Short forms our rules produce</h2><div class="res">' +
        res.map(x => '<code class="' + (links.includes(x) ? 'link' : '') + '">' + x + '</code>').join("") +
        '</div>' + (links.length ? '<p class="why" style="margin:10px 0 0">Highlighted forms are themselves attested names &mdash; if the shortening is real, that is direct evidence for the rule.</p>' : '') +
        '</div>' : '') +
      '<p class="q">Which tradition?</p>' +
      '<div class="opts">' +
        '<button class="y" data-v="yoruba"><span class="dot"></span>Yoruba<kbd style="margin-left:auto">1</kbd></button>' +
        '<button class="i" data-v="igbo"><span class="dot"></span>Igbo<kbd style="margin-left:auto">2</kbd></button>' +
        '<button class="h" data-v="hausa"><span class="dot"></span>Hausa<kbd style="margin-left:auto">3</kbd></button>' +
        '<button class="o" data-v="other"><span class="dot"></span>Other / not sure<kbd style="margin-left:auto">4</kbd></button>' +
      '</div>' +
      '<div class="row2">' +
        '<button class="ghost" data-v="notaname">Not a real name<kbd style="margin-left:auto">N</kbd></button>' +
        '<button class="ghost" data-v="skip">Skip<kbd style="margin-left:auto">S</kbd></button>' +
      '</div>' +
    '</div>';
  main.querySelectorAll("button[data-v]").forEach(b =>
    b.addEventListener("click", () => mark(r.name, b.dataset.v)));
}

function mark(name, v){
  if (v === "skip"){ done[name] = "skipped"; } else { done[name] = v; }
  order.push(name); save(); render();
}
function tally(){
  const c = {};
  Object.values(done).forEach(v => c[v] = (c[v]||0)+1);
  document.getElementById("tally").innerHTML =
    ["yoruba","igbo","hausa","other","notaname","skipped"]
      .filter(k => c[k])
      .map(k => '<span>' + (TRAD[k] || (k==="notaname"?"Not a name":"Skipped")) + ' <b>' + c[k] + '</b></span>')
      .join("") || '<span>Nothing reviewed yet</span>';
}
document.getElementById("undo").addEventListener("click", () => {
  const last = order.pop(); if (!last) return;
  delete done[last]; save(); render();
});
function buildTSV(){
  let out = "name\ttradition\ttype\tprovenance\tstatus\treviewer\n";
  ROWS.forEach(r => {
    const v = done[r.name];
    if (!v || v === "skipped") return;
    const status = v === "notaname" ? "rejected" : "reviewed";
    const trad = v === "notaname" ? r.wiki_tradition : v;
    out += [r.name, trad, r.wiki_type.split("|")[0], "wikipedia", status, ""].join("\t") + "\n";
  });
  return out;
}
document.getElementById("exp").addEventListener("click", () => {
  const tsv = buildTSV();
  const rows = tsv.split("\n").length - 2;
  document.getElementById("main").innerHTML =
    '<div class="card">' +
      '<p class="q">' + rows + ' reviewed rows &mdash; paste into lexicon.tsv</p>' +
      '<textarea id="tsv" readonly spellcheck="false">' + tsv + '</textarea>' +
      '<div class="row2" style="margin-top:12px">' +
        '<button id="cp">Copy to clipboard</button>' +
        '<button id="back" class="ghost">Back to review</button>' +
      '</div>' +
    '</div>';
  const ta = document.getElementById("tsv");
  ta.addEventListener("focus", () => ta.select());
  document.getElementById("cp").addEventListener("click", async () => {
    const btn = document.getElementById("cp");
    try {
      await navigator.clipboard.writeText(tsv);
      btn.textContent = "Copied";
    } catch (e) {
      ta.select(); ta.setSelectionRange(0, tsv.length);
      btn.textContent = "Press " + (navigator.platform.indexOf("Mac") > -1 ? "Cmd" : "Ctrl") + "+C";
    }
    setTimeout(() => { btn.textContent = "Copy to clipboard"; }, 2200);
  });
  document.getElementById("back").addEventListener("click", render);
});
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const i = nextIdx(); if (i < 0) return;
  const map = {"1":"yoruba","2":"igbo","3":"hausa","4":"other","n":"notaname","s":"skip"};
  const k = e.key.toLowerCase();
  if (map[k]){ e.preventDefault(); mark(ROWS[i].name, map[k]); }
  else if (k === "u"){ e.preventDefault(); document.getElementById("undo").click(); }
});
render();
</script>
