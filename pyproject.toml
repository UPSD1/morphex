[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "morphex"
version = "0.1.0"
description = "Name matching for Nigerian names. Handles the Yoruba, Igbo and Hausa shortening patterns that Soundex, Metaphone and Jaro-Winkler miss."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Akinboro" }]
keywords = ["nigeria", "yoruba", "igbo", "hausa", "names", "phonetic",
            "fuzzy-matching", "name-matching", "entity-resolution",
            "deduplication", "record-linkage", "soundex", "metaphone",
            "onomastics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = ["metaphone>=0.6"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/UPSD1/morphex"
Issues = "https://github.com/UPSD1/morphex/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/morphex"]

# The source distribution ships the library, its data, and the tests that
# define its behaviour -- enough for anyone to verify the claims in the
# README. Working files (CI config, review tooling, editor state) are not
# part of the published artifact.
[tool.hatch.build.targets.sdist]
include = [
    "src/morphex",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
